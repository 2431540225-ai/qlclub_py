<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClubHub - Quản lý CLB</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-md navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">ClubHub</a>
    {% if user.is_authenticated %}
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="{% url 'events' %}">Sự kiện</a>
      <a class="nav-link" href="{% url 'tasks' %}">Task</a>
      {% if user.profile.is_officer %}
      <a class="nav-link" href="{% url 'members' %}">Thành viên</a>
      <a class="nav-link" href="{% url 'minutes' %}">AI biên bản</a>
      {% endif %}
    </div>
    <span class="navbar-text me-3">{{ user.username }} · {{ user.profile.get_role_display }}</span>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-light">Đăng xuất</button></form>
    {% endif %}
  </div>
</nav>
<div class="container pb-5">
  {% for m in messages %}<div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
