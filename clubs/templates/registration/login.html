{% extends "clubs/base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width:420px"><div class="card-body">
  <h4>Đăng nhập</h4>
  <form method="post">{% csrf_token %}
    {% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>
      <input class="form-control" type="{{ f.field.widget.input_type }}" name="{{ f.html_name }}" required></div>{% endfor %}
    {{ form.non_field_errors }}
    <button class="btn btn-primary w-100">Đăng nhập</button>
  </form>
  <p class="mt-3 mb-0">Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký</a></p>
</div></div>
{% endblock %}
