{% extends "clubs/base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
    <div class="bg-white border rounded-4 p-4 p-md-5 shadow-sm">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-3 mb-2" style="width: 56px; height: 56px; background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); color: #0A2540; font-size: 1.8rem;">
          <i class="bi bi-airplane-fill"></i>
        </div>
        <h2 class="h4 fw-bold text-dark mt-2 mb-1">Đăng Nhập Hệ Thống</h2>
        <p class="text-muted small">Cổng quản lý CLB Sinh viên Hàng Không (VAA)</p>
      </div>

      {% if form.non_field_errors %}
      <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3">
        {{ form.non_field_errors }}
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        {% for f in form %}
        <div class="mb-3">
          <label class="form-label fw-bold text-dark small">{{ f.label }}</label>
          <input class="form-control py-2" type="{{ f.field.widget.input_type }}" name="{{ f.html_name }}" required style="border-radius: 8px;">
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-2" style="background: linear-gradient(135deg, var(--vaa-navy) 0%, #0056b3 100%); border: none; border-radius: 10px;">
          <i class="bi bi-box-arrow-in-right"></i> Đăng Nhập
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted small">Chưa có tài khoản sinh viên?</span>
        <a href="{% url 'register' %}" class="fw-bold text-decoration-none small ms-1" style="color: var(--vaa-blue);">
          Đăng ký ngay
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
