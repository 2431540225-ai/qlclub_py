{% extends "clubs/base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width:520px"><div class="card-body">
  <h4>Đăng ký thành viên</h4>
  <form method="post">{% csrf_token %}
    {% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}
      {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
    <button class="btn btn-primary w-100">Đăng ký</button>
  </form>
  <p class="mt-3 mb-0"><a href="{% url 'login' %}">Đã có tài khoản? Đăng nhập</a></p>
</div></div>
{% endblock %}
